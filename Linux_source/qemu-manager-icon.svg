<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- QEMU Manager icon — stylized QEMU bird -->
  <rect width="128" height="128" rx="24" fill="#2563eb"/>
  <!-- Bird body -->
  <ellipse cx="64" cy="72" rx="32" ry="36" fill="#f8fafc"/>
  <!-- Bird head -->
  <circle cx="64" cy="44" r="22" fill="#f8fafc"/>
  <!-- Eyes -->
  <circle cx="55" cy="42" r="8" fill="#1e293b"/>
  <circle cx="73" cy="42" r="8" fill="#1e293b"/>
  <circle cx="57" cy="40" r="3" fill="#f8fafc"/>
  <circle cx="75" cy="40" r="3" fill="#f8fafc"/>
  <!-- Beak -->
  <polygon points="64,50 58,58 70,58" fill="#fbbf24"/>
  <!-- Wings -->
  <ellipse cx="38" cy="72" rx="12" ry="24" fill="#e2e8f0" transform="rotate(-15 38 72)"/>
  <ellipse cx="90" cy="72" rx="12" ry="24" fill="#e2e8f0" transform="rotate(15 90 72)"/>
  <!-- VM monitor symbol on body -->
  <rect x="50" y="64" width="28" height="20" rx="3" fill="#2563eb"/>
  <rect x="53" y="67" width="22" height="14" rx="1" fill="#60a5fa"/>
  <rect x="58" y="84" width="12" height="3" rx="1" fill="#2563eb"/>
</svg>
