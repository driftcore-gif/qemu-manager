[binaries]
c = ['/app/termux-native/ndk_extract/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang']
cpp = ['/app/termux-native/ndk_extract/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++']
ar = '/app/termux-native/ndk_extract/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/app/termux-native/ndk_extract/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkgconfig = '/usr/bin/pkg-config'

[built-in options]
c_link_args = ['-Wl,-rpath=/data/data/com.termux/files/usr/lib']
cpp_link_args = ['-Wl,-rpath=/data/data/com.termux/files/usr/lib']

[properties]
pkg_config_libdir = '/app/termux-native/sysroot/data/data/com.termux/files/usr/lib/pkgconfig'
sys_root = '/app/termux-native/sysroot'
needs_exe_wrapper = true

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
