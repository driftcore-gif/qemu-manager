[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkgconfig = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/arm-linux-gnueabihf/glib-2.0/include']
cpp_args = ['-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/arm-linux-gnueabihf/glib-2.0/include']
c_link_args = ['-L/usr/lib/arm-linux-gnueabihf']
cpp_link_args = ['-L/usr/lib/arm-linux-gnueabihf']

[properties]
sys_root = '/'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
