[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['-I/usr/arm-linux-gnueabihf/include']
cpp_args = ['-I/usr/arm-linux-gnueabihf/include']
c_link_args = ['-L/usr/arm-linux-gnueabihf/lib']
cpp_link_args = ['-L/usr/arm-linux-gnueabihf/lib']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
