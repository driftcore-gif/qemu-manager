[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/aarch64-linux-gnu/glib-2.0/include']
cpp_args = ['-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/aarch64-linux-gnu/glib-2.0/include']
c_link_args = ['-L/usr/lib/aarch64-linux-gnu']
cpp_link_args = ['-L/usr/lib/aarch64-linux-gnu']

[properties]
sys_root = '/'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
