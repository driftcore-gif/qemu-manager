[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'pkg-config'

[built-in options]
c_args = ['-I/usr/aarch64-linux-gnu/include']
cpp_args = ['-I/usr/aarch64-linux-gnu/include']
c_link_args = ['-L/usr/aarch64-linux-gnu/lib']
cpp_link_args = ['-L/usr/aarch64-linux-gnu/lib']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
