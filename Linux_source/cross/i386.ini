[binaries]
c = 'gcc'
cpp = 'g++'
ar = 'ar'
strip = 'strip'
pkgconfig = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-m32', '-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/i386-linux-gnu/glib-2.0/include']
cpp_args = ['-m32', '-I/usr/include', '-I/usr/include/gtk-4.0', '-I/usr/lib/i386-linux-gnu/glib-2.0/include']
c_link_args = ['-m32', '-L/usr/lib/i386-linux-gnu']
cpp_link_args = ['-m32', '-L/usr/lib/i386-linux-gnu']

[properties]
sys_root = '/'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
